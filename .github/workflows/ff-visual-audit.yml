name: Temporary FF Visual Pack Resolver

on:
  push:
    paths:
      - ".github/workflows/ff-visual-audit.yml"
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Resolve visual pack download pages
        run: |
          mkdir -p report
          python -m pip install --disable-pip-version-check -q requests beautifulsoup4
          python - <<'PY'
          import json, re, requests
          from bs4 import BeautifulSoup
          urls = [
            "https://bit.ly/3Q1dGKN",
            "https://bit.ly/4lmKRXB",
            "https://earnlinks.in/minecraftdll",
            "https://m8ganoffiicial.blogspot.com/2026/08/mg-skin-tool-pro-full-version-v-127.html",
          ]
          s = requests.Session()
          s.headers["User-Agent"] = "Mozilla/5.0 (Linux; Android 13) AppleWebKit/537.36 Chrome/146 Mobile Safari/537.36"
          out=[]
          for url in urls:
              item={"source":url}
              try:
                  r=s.get(url,allow_redirects=True,timeout=40)
                  item.update({
                    "status":r.status_code,
                    "final_url":r.url,
                    "history":[{"status":h.status_code,"url":h.url,"location":h.headers.get("location")} for h in r.history],
                    "content_type":r.headers.get("content-type"),
                    "content_length":r.headers.get("content-length"),
                    "title":None,
                  })
                  soup=BeautifulSoup(r.text,"html.parser")
                  if soup.title: item["title"]=soup.title.get_text(" ",strip=True)
                  links=[]
                  for a in soup.select("a[href]"):
                      href=a.get("href")
                      if href and not href.startswith(("#","javascript:")):
                          links.append({"text":a.get_text(" ",strip=True)[:200],"href":href})
                  item["links"]=links[:500]
                  item["raw_urls"]=sorted(set(re.findall(r'https?://[^\s"\'<>]+',r.text)))[:1000]
                  with open("report/page-"+str(len(out))+".html","w") as h:
                      h.write(r.text)
              except Exception as e:
                  item["error"]=repr(e)
              out.append(item)
          with open("report/resolved.json","w") as f:
              json.dump(out,f,indent=2,ensure_ascii=False)
          PY
      - name: Upload resolver report
        uses: actions/upload-artifact@v4
        with:
          name: ff-visual-pack-resolver
          path: report/
          retention-days: 1
