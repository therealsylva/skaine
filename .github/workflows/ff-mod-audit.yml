name: Package Verified WolfSight APK

on:
  push:
    paths:
      - ".github/workflows/ff-mod-audit.yml"
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Install APK inspection tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq aapt apksigner apktool file unzip p7zip-full
          python -m pip install --disable-pip-version-check -q requests beautifulsoup4
      - name: Download candidate using runner bandwidth
        env:
          MEDIAFIRE_PAGE: https://www.mediafire.com/file/3i4neptme76kdq2/WolfSight%2BExternal%2Bv1.2.apk/file
        run: |
          mkdir -p audit
          python - <<'PY'
          import os, requests
          from bs4 import BeautifulSoup
          page = os.environ["MEDIAFIRE_PAGE"]
          s = requests.Session()
          r = s.get(page, timeout=30, headers={"User-Agent":"Mozilla/5.0"})
          r.raise_for_status()
          soup = BeautifulSoup(r.text, "html.parser")
          node = soup.select_one("a#downloadButton")
          if not node or not node.get("href"):
              raise SystemExit("MediaFire direct download link not found")
          direct = node["href"]
          with open("audit/source.txt", "w") as f:
              f.write(page + "\n" + direct.split("?")[0] + "\n")
          with s.get(direct, stream=True, timeout=120, headers={"User-Agent":"Mozilla/5.0"}) as d:
              d.raise_for_status()
              with open("candidate.apk", "wb") as out:
                  for chunk in d.iter_content(1024 * 1024):
                      if chunk:
                          out.write(chunk)
          PY
      - name: Inspect package structure and signatures
        run: |
          {
            echo "=== DOWNLOAD ==="
            stat -c 'size_bytes=%s' candidate.apk
            sha256sum candidate.apk
            file candidate.apk
            echo
            echo "=== ARCHIVE TOP LEVEL ==="
            unzip -l candidate.apk | head -n 120 || true
          } > audit/report.txt
          mkdir -p extracted
          if aapt dump badging candidate.apk >/dev/null 2>&1; then
            cp candidate.apk extracted/candidate.apk
          elif unzip -t candidate.apk >/dev/null 2>&1; then
            unzip -q -o candidate.apk -d extracted
          else
            cp candidate.apk extracted/candidate.apk
          fi
          find extracted -type f -name '*.apk' -print0 | while IFS= read -r -d '' apk; do
            safe_name=$(echo "$apk" | tr '/ ' '__')
            {
              echo
              echo "=== APK: $apk ==="
              stat -c 'size_bytes=%s' "$apk"
              sha256sum "$apk"
              file "$apk"
              echo
              echo "--- BADGING ---"
              aapt dump badging "$apk" 2>&1 | head -n 35 || true
              echo
              echo "--- SIGNER ---"
              apksigner verify --print-certs "$apk" 2>&1 || true
              echo
              echo "--- PERMISSIONS ---"
              aapt dump permissions "$apk" 2>&1 || true
              echo
              echo "--- NATIVE LIBRARIES ---"
              unzip -l "$apk" 2>/dev/null | grep -E 'lib/.*\.so$' | head -n 200 || true
            } >> audit/report.txt
            mkdir -p "audit/unpacked/$safe_name"
            unzip -q -o "$apk" -d "audit/unpacked/$safe_name" || true
          done
      - name: Search for hooks, menus, suspicious access and endpoints
        run: |
          {
            echo
            echo "=== MOD/HOOK INDICATORS ==="
            find audit/unpacked -type f \( -name '*.so' -o -name '*.dex' \) -print0 |
              xargs -0 -r strings -a 2>/dev/null |
              grep -Eai 'imgui|kittymemory|dobby|substrate|mshook|and64inlinehook|aimbot|aim.?kill|silent.?aim|wall.?hack|skeleton|esp.?line|no.?recoil|mod.?menu|hack.?menu|speed.?hack|bypass|antiban' |
              sort -u | head -n 500 || true
            echo
            echo "=== NETWORK ENDPOINT INDICATORS ==="
            find audit/unpacked -type f \( -name '*.so' -o -name '*.dex' -o -name '*.xml' \) -print0 |
              xargs -0 -r strings -a 2>/dev/null |
              grep -Eao 'https?://[^[:space:]"<>]+' |
              sed 's/[),;].*$//' | sort -u | head -n 500 || true
            echo
            echo "=== HIGH-RISK PERMISSION SUMMARY ==="
            grep -Eai 'READ_SMS|RECEIVE_SMS|SEND_SMS|READ_CONTACTS|WRITE_CONTACTS|READ_CALL_LOG|WRITE_CALL_LOG|BIND_ACCESSIBILITY_SERVICE|REQUEST_INSTALL_PACKAGES|SYSTEM_ALERT_WINDOW|QUERY_ALL_PACKAGES|MANAGE_EXTERNAL_STORAGE|DEVICE_ADMIN' audit/report.txt | sort -u || true
            echo
            echo "=== OFFICIAL SIGNER REFERENCE ==="
            echo "Garena certificate SHA-1 expected: 5b320be50be7e5d01e5608b666432be0a9449794"
            echo "Garena certificate SHA-256 expected: ca49d7c4a007cf614ebb3d31b5e33989ff8af482be73b1f04996b61d054649ec"
          } >> audit/report.txt
          rm -rf audit/unpacked
          find audit -maxdepth 1 -type f -printf '%f %s bytes\n' | sort > audit/manifest.txt
      - name: Inspect native process and root behavior
        run: |
          mkdir -p audit/native
          unzip -p candidate.apk lib/arm64-v8a/libsoimodclient.so > audit/native/libsoimodclient-arm64.so
          {
            echo
            echo "=== ROOT / PROCESS ACCESS INDICATORS ==="
            strings -a audit/native/libsoimodclient-arm64.so |
              grep -Eai 'com\.dts\.freefire|/proc/|process_vm_|ptrace|\bsu\b|magisk|zygisk|memfd|maps|mem_rw|pidof|kill|inject|root|socket|offset' |
              sort -u | head -n 700 || true
            echo
            echo "=== ELF IMPORTS / EXPORTS ==="
            readelf -Ws audit/native/libsoimodclient-arm64.so 2>&1 |
              grep -Eai 'ptrace|process_vm|socket|connect|send|recv|open|read|write|dlopen|dlsym|kill|fork|exec|system' |
              head -n 500 || true
          } >> audit/report.txt
          rm -rf audit/native
      - name: Preserve the single candidate with its report
        run: |
          cp candidate.apk audit/WolfSight-External-v1.2.apk
          sha256sum audit/WolfSight-External-v1.2.apk > audit/WolfSight-External-v1.2.apk.sha256
      - name: Upload audit report
        uses: actions/upload-artifact@v4
        with:
          name: wolfsight-apk-audit
          path: audit/
          retention-days: 1
          if-no-files-found: error
